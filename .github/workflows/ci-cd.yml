name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t feedback-api:${{ github.sha }} \
            -t feedback-api:latest \
            .

      - name: Deploy
        run: ~/scripts/deploy.sh feedback-api
